
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEE - Detailed Analysis</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="../index.html">← Back to Dashboard</a> | NEE Analysis</h1>
        </header>
        
        <div class="ticker-details">
            <div class="detail-card">
                <h2>Signal Summary</h2>
                <div class="detail-grid">
                    <div class="detail-item">
                        <label>Signal:</label>
                        <span class="signal-buy">BUY</span>
                    </div>
                    <div class="detail-item">
                        <label>Confidence:</label>
                        <span>0.00</span>
                    </div>
                    <div class="detail-item">
                        <label>Predicted Change:</label>
                        <span class="positive">
                            +1.34%
                        </span>
                    </div>
                    <div class="detail-item">
                        <label>Selected Model:</label>
                        <span>Ensemble</span>
                    </div>
                </div>
            </div>
            
            <div class="detail-card">
                <h2>Sentiment Analysis</h2>
                <div class="detail-grid">
                    <div class="detail-item">
                        <label>Sentiment Score:</label>
                        <span>0.086</span>
                    </div>
                    <div class="detail-item">
                        <label>Sentiment Confidence:</label>
                        <span>0.22</span>
                    </div>
                </div>
            </div>
            
            <div class="no-chart">No chart data available</div>
        </div>
    </div>
</body>
</html>
