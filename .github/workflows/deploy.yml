name: Run main.py daily and deploy dashboard

on:
  schedule:
    - cron: "0 7 * * *"  # daily at 07:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      SKIP_TRAINING_ON_CI: "True"
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install ta-lib system dependency
        run: sudo apt-get update && sudo apt-get install -y ta-lib || echo "ta-lib system package install failed; continuing"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          set -e
          # The original workflow attempted to install the `ta-lib` system
          # dependency via `apt-get`.  The package is not available on the
          # Ubuntu 24.04 runner image, causing the job to fail.  We now
          # install the Python wheel `ta-lib-binary` which provides the
          # same functionality without a system dependency.
          #
          # Additionally, the original `requirements.txt` pinned a very
          # old version of `ta-lib-binary` (0.6.3) that is no longer
          # available on PyPI.  We upgrade the requirement to the latest
          # compatible version (0.6.4) to avoid a `No matching distribution`
          # error.
          if [ -f requirements.txt ]; then
            # Ensure pip is up‑to‑date before installing.
            python -m pip install --upgrade pip setuptools wheel
            # Install the wheel for ta-lib first to satisfy the binary
            # dependency for the rest of the packages.
            python -m pip install ta-lib-binary==0.6.4
            # Now install the rest of the requirements.
            python -m pip install --no-cache-dir --prefer-binary -r requirements.txt
          fi

      - name: Run main.py (skip email)
        run: python main.py --skip_email

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_dashboard
          path: web_dashboard/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: web_dashboard
          path: web_dashboard

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web_dashboard
