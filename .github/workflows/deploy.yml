name: Run main.py daily and deploy dashboard

on:
  schedule:
    - cron: "0 7 * * *"  # daily at 07:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      SKIP_TRAINING_ON_CI: "True"
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir --prefer-binary -r requirements.txt

      - name: Create env.py with secrets for TA-Lib fallback
        run: |
          # Create minimal env.py for CI compatibility
          echo "SKIP_TRAINING_ON_CI = True" > env.py
          echo "ALPACA_API_KEY = '${{ secrets.ALPACA_API_KEY }}'" >> env.py
          echo "ALPACA_SECRET_KEY = '${{ secrets.ALPACA_SECRET_KEY }}'" >> env.py
          echo "FINNHUB_API_KEY = '${{ secrets.FINNHUB_API_KEY }}'" >> env.py
          echo "REDDIT_CLIENT_ID = '${{ secrets.REDDIT_CLIENT_ID }}'" >> env.py
          echo "REDDIT_CLIENT_SECRET = '${{ secrets.REDDIT_CLIENT_SECRET }}'" >> env.py
          echo "REDDIT_USER_AGENT = '${{ secrets.REDDIT_USER_AGENT }}'" >> env.py
          echo "EMAIL_SENDER = '${{ secrets.EMAIL_SENDER }}'" >> env.py
          echo "EMAIL_RECEIVER = '${{ secrets.EMAIL_RECEIVER }}'" >> env.py
          echo "GMAIL_APP_PASSWORD = '${{ secrets.GMAIL_APP_PASSWORD }}'" >> env.py

      - name: Run main.py (skip email)
        run: python main.py --skip_email

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_dashboard
          path: web_dashboard/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Download dashboard artifact
        uses: actions/download-artifact@v4
        with:
          name: web_dashboard
          path: web_dashboard

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web_dashboard